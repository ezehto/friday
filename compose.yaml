services:
  preview:
    build:
      context: .
      target: preview
    image: friday-preview:0.1.0
    ports:
      - "127.0.0.1:8742:8742"
    read_only: true
    tmpfs:
      - /tmp
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8742/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
