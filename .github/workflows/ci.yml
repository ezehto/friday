name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Local mock overlay must not be tracked
        working-directory: .
        run: test -z "$(git ls-files frontend/src/mocks/local)"
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --target preview .

  e2e:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - run: docker compose up --build -d --wait preview
      - run: npm install -g @playwright/cli@0.1.24
      # Linux system packages for the browser are unverified on the runner; confirm on the first CI run.
      - run: playwright-cli install-browser chromium
      - run: bash frontend/e2e/smoke.sh
      - if: always()
        run: docker compose down
